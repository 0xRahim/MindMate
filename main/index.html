<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>MindMate</title>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<style>
/* ── TOKENS ───────────────────────────────────────────────────────────────── */
:root{
  --bg:#07020e;
  --surface:rgba(14,5,28,0.97);
  --surface2:rgba(22,8,42,0.98);
  --glass:rgba(12,4,24,0.88);
  --text:#ede0ff;
  --muted:#7a6a9a;
  --accent:#b44fff;
  --accent2:#d183ff;
  --cyan:#00f0ff;
  --green:#00ff9d;
  --red:#ff3366;
  --yellow:#ffd000;
  --magenta:#ff00cc;
  --border:rgba(180,79,255,0.18);
  --border-hi:rgba(180,79,255,0.42);
  --glow:rgba(180,79,255,0.22);
  --teal:#00f0ff;
  --r:8px;
}

/* ── RESET ───────────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
  color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif;font-size:13px}

/* subtle purple atmosphere behind everything */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 60% 50% at 15% 50%,rgba(120,0,200,0.07) 0%,transparent 100%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(0,200,255,0.05) 0%,transparent 100%),
    radial-gradient(ellipse 70% 60% at 50% 100%,rgba(180,0,255,0.06) 0%,transparent 100%);}

/* ── CANVAS ──────────────────────────────────────────────────────────────── */
#canvasWrap{position:fixed;inset:0;z-index:1;}
canvas{display:block;width:100%;height:100%}
/* scanline texture over 3-D view */
#canvasWrap::after{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.022) 2px,rgba(0,0,0,0.022) 4px);}

/* ── TOP HUD BAR ─────────────────────────────────────────────────────────── */
#topBar{position:fixed;top:0;left:0;right:0;height:52px;z-index:40;
  display:flex;align-items:center;justify-content:space-between;padding:0 14px;
  background:linear-gradient(180deg,rgba(7,2,14,0.96) 0%,rgba(7,2,14,0) 100%);
  backdrop-filter:blur(16px);}

.logo{display:flex;align-items:center;gap:10px;user-select:none;}
.logo-icon{width:34px;height:34px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--magenta));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 20px rgba(180,79,255,0.55),inset 0 1px 0 rgba(255,255,255,0.18);}
.logo-icon svg{width:18px;height:18px;color:#fff;stroke-width:2;}
.logo-name{font-size:15px;font-weight:900;letter-spacing:-0.3px;
  background:linear-gradient(90deg,var(--accent2),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-sub{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-top:1px;}

/* three HUD action buttons */
.hud-btns{display:flex;align-items:center;gap:5px;}
.hud-btn{
  position:relative;width:52px;height:40px;border-radius:7px;
  background:rgba(180,79,255,0.06);border:1px solid var(--border);
  color:var(--muted);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;cursor:pointer;
  transition:all 0.18s;appearance:none;
  font-size:0; /* suppress any stray text render */
}
.hud-btn svg{width:15px;height:15px;stroke-width:2;}
.hud-lbl{font-size:8px;font-weight:700;text-transform:uppercase;
  letter-spacing:0.06em;color:var(--muted);line-height:1;font-size:7.5px;}
.hud-btn:hover{color:var(--accent2);border-color:var(--border-hi);
  background:rgba(180,79,255,0.12);box-shadow:0 0 16px rgba(180,79,255,0.2);}
.hud-btn.active{color:var(--accent2);border-color:var(--accent);
  background:rgba(180,79,255,0.18);
  box-shadow:0 0 22px rgba(180,79,255,0.32),inset 0 0 14px rgba(180,79,255,0.07);}
.hud-btn.active .hud-lbl{color:var(--accent2);}
/* small status dot on the Status button */
.sdot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;
  background:var(--muted);border:1px solid var(--bg);transition:background .3s,box-shadow .3s;}
.sdot.on{background:var(--green);box-shadow:0 0 6px var(--green);}
.sdot.off{background:var(--red);box-shadow:0 0 5px rgba(255,51,102,0.5);}

/* ── FLOATING PANELS ─────────────────────────────────────────────────────── */
.fp{
  position:fixed;top:58px;right:12px;width:298px;
  max-height:calc(100vh - 76px);overflow-y:auto;overflow-x:hidden;
  z-index:35;
  background:var(--surface);border:1px solid var(--border-hi);border-radius:10px;
  backdrop-filter:blur(28px);
  transform:translateX(calc(100% + 16px));opacity:0;pointer-events:none;
  transition:transform 0.26s cubic-bezier(0.34,1.12,0.64,1),opacity 0.2s ease;}
.fp.open{transform:translateX(0);opacity:1;pointer-events:auto;}
.fp::-webkit-scrollbar{width:2px}
.fp::-webkit-scrollbar-thumb{background:rgba(180,79,255,0.28);border-radius:2px}
/* cyberpunk corner brackets */
.fp::before,.fp::after{content:'';position:absolute;width:11px;height:11px;
  border-color:var(--accent);border-style:solid;z-index:1;pointer-events:none;}
.fp::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:2px 0 0 0;}
.fp::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 2px 0;}

/* panel sections */
.fp-sec{padding:12px 13px;border-bottom:1px solid rgba(180,79,255,0.09);}
.fp-sec:last-child{border-bottom:none;}
.fp-hdr{display:flex;align-items:center;gap:7px;margin-bottom:10px;
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:var(--accent2);}
.fp-hdr svg{width:11px;height:11px;color:var(--accent);stroke-width:2.5;}
.fp-hdr-r{margin-left:auto;font-size:9px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;}

/* ── FORM ELEMENTS ───────────────────────────────────────────────────────── */
input[type=text],textarea,select{
  width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:6px;color:var(--text);padding:7px 10px;font-size:12px;
  outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit;}
input[type=text]:focus,textarea:focus{
  border-color:rgba(180,79,255,0.5);box-shadow:0 0 0 3px rgba(180,79,255,0.08);}
select{cursor:pointer;}
select option{background:#120824;}
textarea{min-height:64px;resize:vertical;line-height:1.5;}
input[type=file]{
  width:100%;font-size:11px;color:var(--muted);cursor:pointer;
  background:rgba(255,255,255,0.02);border:1px dashed rgba(180,79,255,0.28);
  border-radius:6px;padding:7px 10px;transition:border-color .2s;}
input[type=file]:hover{border-color:var(--accent);}
/* range sliders */
input[type=range]{
  width:100%;-webkit-appearance:none;height:3px;
  background:rgba(180,79,255,0.14);border-radius:99px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:var(--accent2);cursor:pointer;box-shadow:0 0 8px rgba(180,79,255,0.5);}
input[type=range]::-moz-range-thumb{
  width:12px;height:12px;border-radius:50%;border:0;
  background:var(--accent2);box-shadow:0 0 8px rgba(180,79,255,0.5);}

/* ── BUTTONS ─────────────────────────────────────────────────────────────── */
button{
  appearance:none;border:0;border-radius:7px;padding:7px 11px;
  background:linear-gradient(155deg,#8b3fcc,#681fa8);
  color:#fff;font-weight:700;font-size:11px;cursor:pointer;white-space:nowrap;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:transform .12s,box-shadow .15s,opacity .12s;}
button svg{width:12px;height:12px;stroke-width:2.5;flex-shrink:0;}
button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 16px rgba(139,63,204,0.45);}
button:active:not(:disabled){transform:scale(.97);}
button:disabled{opacity:.28;cursor:default;}
button.sec{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);}
button.sec:hover:not(:disabled){
  background:rgba(180,79,255,0.1);border-color:rgba(180,79,255,0.4);color:var(--accent2);
  box-shadow:0 4px 14px rgba(180,79,255,0.15);}
button.danger{background:linear-gradient(155deg,#cc1f4a,#99102e);}
button.danger:hover:not(:disabled){box-shadow:0 4px 16px rgba(204,31,74,0.42);}
button.go{background:linear-gradient(155deg,#008850,#005c35);}
button.go:hover:not(:disabled){box-shadow:0 4px 16px rgba(0,136,80,0.4);}
button.mic-on{
  background:linear-gradient(155deg,#cc1f4a,#99102e)!important;
  border-color:var(--red)!important;color:#fff!important;
  animation:mic-pulse 1.2s ease-in-out infinite;}
@keyframes mic-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,51,102,0.4)}50%{box-shadow:0 0 0 8px rgba(255,51,102,0)}}

/* ── LAYOUT HELPERS ──────────────────────────────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;}
.mt{margin-top:8px;} .mt5{margin-top:5px;}

/* ── SLIDER GRID ─────────────────────────────────────────────────────────── */
.sl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sl-item label{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;
  align-items:center;margin-bottom:4px;}
.sl-item label strong{color:var(--accent2);font-variant-numeric:tabular-nums;}

/* ── STATUS / CONNECTION ─────────────────────────────────────────────────── */
.conn-row{display:flex;align-items:center;gap:8px;padding:7px 9px;
  background:rgba(0,0,0,0.22);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s,box-shadow .3s;}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
.dot.off{background:var(--red);box-shadow:0 0 6px rgba(255,51,102,0.4);}
#ttsLabel{font-size:11px;color:var(--muted);flex:1;}
.status{font-size:10px;color:var(--muted);line-height:1.6;}
.status strong{color:var(--text);}
.amp-row{display:flex;align-items:center;gap:7px;margin-top:7px;}
.amp-track{flex:1;height:3px;background:rgba(180,79,255,0.1);border-radius:99px;overflow:hidden;}
.amp-fill{height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .04s linear;}
.amp-lbl{font-size:10px;color:var(--muted);width:28px;text-align:right;font-variant-numeric:tabular-nums;}

/* ── VOICE / SPEED ROW ───────────────────────────────────────────────────── */
.voice-row{display:flex;gap:7px;align-items:flex-end;}
.voice-row select{flex:1;}
.spd{display:flex;flex-direction:column;gap:4px;flex-shrink:0;min-width:82px;}
.spd label{font-size:10px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;}
.spd label strong{color:var(--accent2);}

/* ── ANIM / EMOTE BUTTONS ────────────────────────────────────────────────── */
.anim-btn,.emote-btn{
  background:rgba(180,79,255,0.04);border:1px solid var(--border);
  color:var(--muted);font-weight:600;font-size:10px;padding:6px 4px;
  text-align:center;border-radius:6px;line-height:1.3;
  transition:all .17s;cursor:pointer;white-space:normal;}
.anim-btn:hover{color:var(--cyan);border-color:var(--cyan);background:rgba(0,240,255,0.07);}
.anim-btn.active{background:rgba(0,240,255,0.1);border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 9px rgba(0,240,255,0.18);}
.emote-btn:hover{color:var(--accent2);border-color:var(--accent);background:rgba(180,79,255,0.1);}
.emote-btn.active{background:rgba(180,79,255,0.16);border-color:var(--accent2);color:var(--accent2);
  box-shadow:0 0 9px rgba(180,79,255,0.22);}

/* ── CHAT PANEL ──────────────────────────────────────────────────────────── */
#chatPanel{
  position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  width:min(640px,calc(100vw - 28px));z-index:20;
  background:var(--surface);border:1px solid var(--border-hi);
  border-radius:13px;backdrop-filter:blur(28px);overflow:hidden;}
/* corner brackets */
#chatPanel::before,#chatPanel::after{
  content:'';position:absolute;width:13px;height:13px;
  border-color:var(--accent);border-style:solid;z-index:1;pointer-events:none;}
#chatPanel::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:2px 0 0 0;}
#chatPanel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 2px 0;}

/* chat history */
.chat-history{max-height:165px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;
  padding:11px 14px 8px;scroll-behavior:smooth;}
.chat-history::-webkit-scrollbar{width:2px}
.chat-history::-webkit-scrollbar-thumb{background:rgba(180,79,255,0.22);border-radius:2px}
.chat-msg{font-size:12px;line-height:1.5;display:flex;gap:7px;align-items:flex-start;}
.chat-msg .who{font-size:9px;font-weight:800;flex-shrink:0;padding-top:2px;min-width:20px;
  text-transform:uppercase;letter-spacing:0.08em;}
.chat-msg.user .who{color:var(--accent2);}
.chat-msg.bot  .who{color:var(--cyan);}
.chat-msg.user .body{color:rgba(237,224,255,0.62);font-size:12px;}
.chat-msg.bot  .body{color:var(--text);font-size:12px;}
.chat-msg.sys  .body{color:var(--yellow);font-style:italic;font-size:11px;}

/* input area */
.cp-input{padding:8px 12px 11px;border-top:1px solid rgba(180,79,255,0.1);}
.chat-input-row{display:flex;gap:6px;align-items:center;}

#chatInput{
  flex:1;padding:9px 13px;border-radius:8px;font-size:13px;
  background:rgba(255,255,255,0.05);border:1px solid var(--border);}
#chatInput:focus{border-color:rgba(180,79,255,0.5);box-shadow:0 0 0 3px rgba(180,79,255,0.08);}
#chatInput::placeholder{color:var(--muted);}

#micBtn{width:38px;height:38px;border-radius:8px;padding:0;flex-shrink:0;
  background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--muted);}
#micBtn svg{width:15px;height:15px;}
#micBtn:hover:not(:disabled){
  background:rgba(180,79,255,0.1);color:var(--accent2);
  box-shadow:0 4px 14px rgba(180,79,255,0.2);}
#sendBtn{width:38px;height:38px;border-radius:8px;padding:0;flex-shrink:0;}
#sendBtn svg{width:15px;height:15px;}

/* ── STT LISTENING ANIMATION ─────────────────────────────────────────────── */
/* replaces text input when mic is recording */
.listen-anim{
  flex:1;height:38px;border-radius:8px;display:none;
  align-items:center;justify-content:center;gap:3px;padding:0 12px;
  background:rgba(255,51,102,0.07);border:1px solid rgba(255,51,102,0.32);}
.lb{width:3px;border-radius:3px;background:var(--red);
  animation:lb-wave .58s ease-in-out infinite;}
.lb:nth-child(1){height:7px; animation-delay:.00s}
.lb:nth-child(2){height:15px;animation-delay:.07s}
.lb:nth-child(3){height:11px;animation-delay:.14s}
.lb:nth-child(4){height:22px;animation-delay:.09s}
.lb:nth-child(5){height:13px;animation-delay:.19s}
.lb:nth-child(6){height:19px;animation-delay:.04s}
.lb:nth-child(7){height:9px; animation-delay:.13s}
.lb:nth-child(8){height:17px;animation-delay:.17s}
.listen-lbl{font-size:10px;font-weight:800;color:var(--red);
  text-transform:uppercase;letter-spacing:.1em;margin-left:9px;}
@keyframes lb-wave{0%,100%{transform:scaleY(.32)}50%{transform:scaleY(1)}}

/* CSS-only toggle: when micBtn has .mic-on, swap input ↔ waves */
.chat-input-row:has(#micBtn.mic-on) #chatInput{display:none}
.chat-input-row:has(#micBtn.mic-on) .listen-anim{display:flex}

/* chat state */
#chatState{font-size:10px;color:var(--muted);min-height:14px;
  display:flex;align-items:center;gap:6px;margin-top:5px;}
.tdots{display:inline-flex;gap:3px}
.tdots span{width:3px;height:3px;border-radius:50%;background:var(--accent);
  animation:td .9s ease-in-out infinite}
.tdots span:nth-child(2){animation-delay:.2s}.tdots span:nth-child(3){animation-delay:.4s}
@keyframes td{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}

/* ── CANVAS OVERLAYS ─────────────────────────────────────────────────────── */
.overlay{
  position:absolute;left:14px;bottom:260px;z-index:10;
  max-width:min(500px,58vw);padding:10px 14px;border-radius:10px;
  background:rgba(7,2,14,0.82);border:1px solid rgba(180,79,255,0.2);
  backdrop-filter:blur(12px);}
.ov-title{font-size:10px;color:var(--cyan);font-weight:700;margin-bottom:3px;
  display:flex;align-items:center;gap:6px;}
.ov-title svg{width:10px;height:10px;}
.loader{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--cyan);
  box-shadow:0 0 0 3px rgba(0,240,255,0.12);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(0,240,255,0.12)}50%{box-shadow:0 0 0 7px rgba(0,240,255,0.2)}}
.ov-text{font-size:13px;line-height:1.5;}

/* Now Playing pill */
#nowPlaying{
  position:fixed;top:60px;left:14px;z-index:20;padding:5px 12px;border-radius:99px;
  background:rgba(7,2,14,0.9);border:1px solid var(--cyan);
  font-size:10px;color:var(--cyan);font-weight:700;
  display:none;align-items:center;gap:6px;
  backdrop-filter:blur(8px);box-shadow:0 0 14px rgba(0,240,255,0.22);}
#nowPlaying svg{width:11px;height:11px;}
</style>

<script type="importmap">
{"imports":{
  "three":            "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":    "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@2/lib/three-vrm.module.min.js"
}}
</script>
</head>
<body>

<!-- 3-D viewport -->
<div id="canvasWrap">
  <div class="overlay">
    <div class="ov-title"><span class="loader"></span> MindMate Live</div>
    <div id="overlayText" class="ov-text">Load a VRM model to begin.</div>
  </div>
</div>

<!-- Now-playing pill (top-left, shown by JS) -->
<div id="nowPlaying">
  <i data-lucide="music-2"></i>
  <span id="nowPlayingName"></span>
</div>

<!-- ═══ TOP HUD BAR ═══════════════════════════════════════════════════════ -->
<div id="topBar">
  <div class="logo">
    <div class="logo-icon"><i data-lucide="brain-circuit"></i></div>
    <div>
      <div class="logo-name">MindMate</div>
      <div class="logo-sub">AI · Kokoro TTS · Mixamo · Real-time</div>
    </div>
  </div>

  <div class="hud-btns">
    <!-- Status: TTS + VRM -->
    <button class="hud-btn" id="statusBtn"
            onclick="togglePanel('statusPanel')" title="Status">
      <i data-lucide="activity"></i>
      <span class="hud-lbl">Status</span>
      <span class="sdot off" id="statusBtnDot"></span>
    </button>
    <!-- Interact: TTS speak + Animations + Emotes -->
    <button class="hud-btn" id="interactBtn"
            onclick="togglePanel('interactPanel')" title="Interact">
      <i data-lucide="gamepad-2"></i>
      <span class="hud-lbl">Interact</span>
    </button>
    <!-- Debug: Position sliders + Expression debug -->
    <button class="hud-btn" id="debugBtn"
            onclick="togglePanel('debugPanel')" title="Debug">
      <i data-lucide="sliders-horizontal"></i>
      <span class="hud-lbl">Debug</span>
    </button>
  </div>
</div>

<!-- ═══ STATUS PANEL ══════════════════════════════════════════════════════ -->
<div class="fp" id="statusPanel">

  <!-- TTS connection -->
  <div class="fp-sec">
    <div class="fp-hdr"><i data-lucide="radio"></i> Kokoro TTS</div>
    <div class="conn-row">
      <div class="dot off" id="ttsDot"></div>
      <span id="ttsLabel">Not connected</span>
    </div>
    <input id="ttsUrl" type="text" placeholder="http://localhost:5000"
           value="http://localhost:5000" style="margin-bottom:8px"/>
    <div class="g2">
      <button class="go" id="connectBtn" onclick="connectTTS()">
        <i data-lucide="zap"></i> Connect
      </button>

     ALL JAVASCRIPT — ZERO LOGIC CHANGES.
     Only three lines appended at the very bottom (panel toggle + Lucide init).
═══════════════════════════════════════════════════════════════════════════ -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls }             from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }                from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader }                 from 'three/addons/loaders/FBXLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

// ── Mixamo → VRM bone map (official pixiv) ──────────────────────────────────
const mixamoVRMRigMap = {
  mixamorigHips:'hips',mixamorigSpine:'spine',mixamorigSpine1:'chest',
  mixamorigSpine2:'upperChest',mixamorigNeck:'neck',mixamorigHead:'head',
  mixamorigLeftShoulder:'leftShoulder',mixamorigLeftArm:'leftUpperArm',
  mixamorigLeftForeArm:'leftLowerArm',mixamorigLeftHand:'leftHand',
  mixamorigRightShoulder:'rightShoulder',mixamorigRightArm:'rightUpperArm',
  mixamorigRightForeArm:'rightLowerArm',mixamorigRightHand:'rightHand',
  mixamorigLeftUpLeg:'leftUpperLeg',mixamorigLeftLeg:'leftLowerLeg',
  mixamorigLeftFoot:'leftFoot',mixamorigLeftToeBase:'leftToes',
  mixamorigRightUpLeg:'rightUpperLeg',mixamorigRightLeg:'rightLowerLeg',
  mixamorigRightFoot:'rightFoot',mixamorigRightToeBase:'rightToes',
};

// ── Official pixiv loadMixamoAnimation ─────────────────────────────────────
function loadMixamoAnimation(url, vrm) {
  return new FBXLoader().loadAsync(url).then(asset => {
    const clip = THREE.AnimationClip.findByName(asset.animations,'mixamo.com')
              ?? asset.animations[0];
    if (!clip) throw new Error('No animation in ' + url);
    const restRotInv=new THREE.Quaternion(), parentRestWQ=new THREE.Quaternion();
    const _q=new THREE.Quaternion();
    const mixHips=asset.getObjectByName('mixamorigHips');
    const motionH=mixHips?mixHips.position.y:1;
    let vrmH=1;
    try{vrmH=vrm.humanoid.normalizedRestPose.hips?.position?.[1]??1;}catch(_){}
    const hipsScale=Math.abs(motionH)>1e-6?vrmH/motionH:1;
    const isVRM0=vrm.meta?.metaVersion==='0';
    const tracks=[];
    clip.tracks.forEach(track=>{
      const [mixBone,prop]=track.name.split('.');
      const vrmKey=mixamoVRMRigMap[mixBone];
      const vrmNode=vrm.humanoid.getNormalizedBoneNode(vrmKey);
      const fbxNode=asset.getObjectByName(mixBone);
      if(!vrmKey||!vrmNode||!fbxNode) return;
      fbxNode.getWorldQuaternion(restRotInv).invert();
      fbxNode.parent.getWorldQuaternion(parentRestWQ);
      if(track instanceof THREE.QuaternionKeyframeTrack){
        for(let i=0;i<track.values.length;i+=4){
          _q.fromArray(track.values,i).premultiply(parentRestWQ).multiply(restRotInv);
          _q.toArray(track.values,i);
        }
        const vals=isVRM0?track.values.map((v,i)=>i%2===0?-v:v):track.values.slice();
        tracks.push(new THREE.QuaternionKeyframeTrack(`${vrmNode.name}.${prop}`,track.times,vals));
      } else if(track instanceof THREE.VectorKeyframeTrack){
        const vals=track.values.map((v,i)=>(isVRM0&&i%3!==1?-v:v)*hipsScale);
        tracks.push(new THREE.VectorKeyframeTrack(`${vrmNode.name}.${prop}`,track.times,vals));
      }
    });
    return new THREE.AnimationClip('vrmAnim',clip.duration,tracks);
  });
}

// ── Emote data ──────────────────────────────────────────────────────────────
const EMOTES=[
  {id:'idle',label:'Idle',hint:'Rest'},{id:'wave',label:'Wave',hint:'Wave'},
  {id:'nod',label:'Nod',hint:'Nod'},{id:'dance',label:'Dance',hint:'Dance'},
  {id:'think',label:'Think',hint:'Think'},{id:'bounce',label:'Bounce',hint:'Bounce'},
  {id:'shrug',label:'Shrug',hint:'Shrug'},{id:'point',label:'Point',hint:'Point'},
];

// ── Scene ───────────────────────────────────────────────────────────────────
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x08090f); // dark fallback until GLB loads
// No fog — interior room provides natural depth/occlusion
const camera=new THREE.PerspectiveCamera(34,1,.1,100);
camera.position.set(0,1.45,3);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('canvasWrap').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.target.set(0,1.35,0);controls.update();
// Interior-tuned lighting: warm ceiling fill + character key/fill/rim
scene.add(new THREE.HemisphereLight(0xffe8cc,0x1a1008,0.65));
const kl=new THREE.DirectionalLight(0xfff5e0,2.0);kl.position.set(2,4,3);
kl.castShadow=true;kl.shadow.mapSize.set(1024,1024);kl.shadow.camera.near=0.5;kl.shadow.camera.far=20;scene.add(kl);
const fl=new THREE.DirectionalLight(0xd0c8ff,0.5);fl.position.set(-2,2,2);scene.add(fl);
const rl=new THREE.DirectionalLight(0xffcf80,0.45);rl.position.set(0,3,-2);scene.add(rl);
// No GridHelper / floor placeholder — 3D background provides floor and walls

// ── 3D Background (loft interior) ────────────────────────────────────────────
// Loaded from background/ subfolder. Auto-scales so ceiling height ≈ 4 m,
// floors the model at Y=0 (where the VRM character stands), and centers it.
// After loading, scans every mesh name for sofa/couch keywords and positions
// the VRM character in front of the nearest sofa face.
(function loadBackground(){
  const bgLoader=new GLTFLoader();
  bgLoader.load(
    'background/loft_5_interior_for_free.glb',
    ({scene:bg})=>{
      // ── Scale & position the room ─────────────────────────────────────────
      const box=new THREE.Box3().setFromObject(bg);
      const sz=box.getSize(new THREE.Vector3());
      const ctr=box.getCenter(new THREE.Vector3());
      const s=4.0/sz.y;                     // scale so room height = 4 m
      bg.scale.setScalar(s);
      bg.position.set(-ctr.x*s, -box.min.y*s, -ctr.z*s);
      bg.traverse(o=>{ if(o.isMesh){ o.receiveShadow=true; if(o.material)o.material.depthWrite=true; } });
      scene.add(bg);
      scene.background=null;
      console.log('[BG] Loft loaded · scale:',s.toFixed(3),'· room size:',sz.x.toFixed(1),'×',sz.y.toFixed(1),'×',sz.z.toFixed(1),'m');

      // ── Log all mesh names (helps identify sofa if auto-detect misses) ────
      const meshNames=[];
      bg.traverse(o=>{ if(o.isMesh&&o.name) meshNames.push(o.name); });
      meshNames.sort();
      console.log('[BG] Mesh names:\n  '+meshNames.join('\n  '));

      // ── Auto-detect sofa / couch ──────────────────────────────────────────
      const SOFA_RE=/sofa|couch|settee|divan|loveseat|sectional/i;
      let sofaMesh=null;
      bg.traverse(o=>{ if(!sofaMesh&&o.isMesh&&SOFA_RE.test(o.name)) sofaMesh=o; });

      if(sofaMesh){
        // Get the sofa's world-space bounding box (bg transforms already applied)
        const sofaBox=new THREE.Box3().setFromObject(sofaMesh);
        const sofaCtr=sofaBox.getCenter(new THREE.Vector3());
        // "In front of sofa" = sofa centre X, and standing 0.5 m past the sofa's
        // closest face toward +Z (which is toward the camera at Z=3).
        const fwdZ=sofaBox.max.z+0.5;
        _setCharPos(sofaCtr.x, 0, fwdZ, true);
        console.log('[BG] Sofa detected:',sofaMesh.name,'→ character at',sofaCtr.x.toFixed(2),fwdZ.toFixed(2));
      } else {
        console.warn('[BG] No sofa mesh matched — use the Position sliders to place the character. Mesh list above.');
        $('soafStatus').textContent='(use sliders)';
      }
    },
    xhr=>{ if(xhr.total)console.log('[BG]',Math.round(xhr.loaded/xhr.total*100)+'% …'); },
    e=>console.error('[BG] Failed to load background GLB:',e)
  );
})();

// ── State ───────────────────────────────────────────────────────────────────
let vrm=null,blobUrl=null,activeEmote='idle',autoBlink=true;
let blinkV=0,blinkH=0,mouthDrive=0,mouthSeed=Math.random()*1000,speaking=false;
const clock=new THREE.Clock();
let socket=null,ttsConnected=false;
let audioCtx=null,analyser=null,analyserData=null,nextStart=0;
let mixer=null,activeAction=null,fbxPlaying=false,loopAnimation=true;
const clipCache=new Map();
// Deferred animation actions — both activated on first audio_chunk for tight sync
let _pendingLoop=null, _pendingShot=null, _firstChunk=true;
// Auto-idle: plays a looping FBX idle when nothing else is active
let autoIdle=false, idleCycleAt=Infinity;
// synthActive: true between socket.emit('synthesize') and synthesis fully done
let synthActive=false;
// Character world-space position (placed in front of sofa or manually tuned)
let charPos={x:1.35,y:1.76,z:1.00};
let chatHistory=[];
const $=id=>document.getElementById(id);

// ── Chat helpers ────────────────────────────────────────────────────────────
function addMsg(role,text){
  const d=document.createElement('div');
  d.className='chat-msg '+role;
  const who=role==='user'?'You':role==='bot'?'Her':'...';
  d.innerHTML=`<span class="who">${who}</span><span class="body">${escHtml(text)}</span>`;
  $('chatHistory').appendChild(d);
  $('chatHistory').scrollTop=$('chatHistory').scrollHeight;
  if(role!=='sys') chatHistory.push({role:role==='bot'?'assistant':'user',content:text});
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setChatState(s){
  const el=$('chatState');
  if(s==='thinking') el.innerHTML='<span style="color:var(--yellow)">Thinking</span><span class="tdots"><span></span><span></span><span></span></span>';
  else if(s==='speaking') el.innerHTML='<span style="color:var(--teal)">&#9654; Speaking</span>';
  else if(s==='listening') el.innerHTML='<span style="color:var(--red)">&#9679; Listening</span>';
  else el.innerHTML=s?`<span style="color:var(--red)">${escHtml(s)}</span>`:'';
}

// ── Audio / AnalyserNode ────────────────────────────────────────────────────
function ensureAudio(){
  if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return;}
  audioCtx=new(window.AudioContext||window.webkitAudioContext)({sampleRate:24000,latencyHint:'playback'});
  analyser=audioCtx.createAnalyser();analyser.fftSize=512;analyser.smoothingTimeConstant=0.6;
  analyserData=new Uint8Array(analyser.frequencyBinCount);analyser.connect(audioCtx.destination);
}
function scheduleChunk(buf){
  ensureAudio();
  const p16=new Int16Array(buf),f32=new Float32Array(p16.length);
  for(let i=0;i<p16.length;i++)f32[i]=p16[i]/32768;
  const ab=audioCtx.createBuffer(1,f32.length,24000);ab.copyToChannel(f32,0);
  const src=audioCtx.createBufferSource();src.buffer=ab;src.connect(analyser);
  const LOOKAHEAD=0.08;
  const when=Math.max(audioCtx.currentTime+LOOKAHEAD,nextStart);
  src.start(when);nextStart=when+ab.duration;speaking=true;
  src.onended=()=>{if(audioCtx.currentTime>=nextStart-0.05){speaking=false;synthActive=false;setChatState('');setTimeout(startIdleLoop,450);}};
}
function audioRMS(){
  if(!analyser||!analyserData)return 0;
  analyser.getByteTimeDomainData(analyserData);
  let s=0;for(let i=0;i<analyserData.length;i++){const v=(analyserData[i]-128)/128;s+=v*v;}
  return Math.sqrt(s/analyserData.length);
}

// ── TTS WebSocket ───────────────────────────────────────────────────────────
function connectTTS(){
  const url=$('ttsUrl').value.trim();if(!url)return;
  setTTSUI('Connecting...','off');
  $('connectBtn').disabled=$('disconnectBtn').disabled=true;
  socket=window.io(url,{transports:['websocket']});
  socket.on('connect',()=>{
    ttsConnected=true;setTTSUI('Connected','on');
    $('connectBtn').disabled=true;$('disconnectBtn').disabled=false;
    $('speakBtn').disabled=false;$('ttsMsg').textContent='Ready.';
  });
  socket.on('disconnect',()=>{
    ttsConnected=false;speaking=false;synthActive=false;setTTSUI('Disconnected','off');
    $('connectBtn').disabled=false;$('disconnectBtn').disabled=true;
    $('speakBtn').disabled=true;$('ampRow').style.display='none';
    startIdleLoop();
  });
  socket.on('connect_error',err=>{
    ttsConnected=false;setTTSUI('Failed: '+err.message,'off');
    $('connectBtn').disabled=false;$('disconnectBtn').disabled=true;
  });

  // ── synthesis_start: TTS is generating — do NOT start animations yet ────────
  // We wait for the first real audio_chunk so animation and audio are locked together.
  socket.on('synthesis_start',()=>{
    nextStart=0;speaking=true;_firstChunk=true;synthActive=true;
    $('ampRow').style.display='flex';setChatState('speaking');
  });

  // ── audio_chunk: actual PCM data is arriving — NOW start animations ─────────
  // Both loop and one-shot are activated here so animation begins the exact moment
  // audio begins streaming. The 80ms LOOKAHEAD means audio plays ~80ms after
  // scheduling, giving the animation just enough runway to get into motion.
  socket.on('audio_chunk',d=>{
    if(d.pcm)scheduleChunk(d.pcm);
    if(_firstChunk){
      _firstChunk=false;
      if(_pendingLoop){_activateAction(_pendingLoop.action,_pendingLoop.name);_pendingLoop=null;}
      if(_pendingShot){_activateAction(_pendingShot.action,_pendingShot.name);_pendingShot=null;}
    }
  });

  socket.on('synthesis_done',()=>{$('ttsMsg').textContent='Done.';synthActive=false;});
  socket.on('error',d=>{speaking=false;synthActive=false;$('ttsMsg').textContent='Error: '+d.message;startIdleLoop();});
  socket.on('cancelled',()=>{speaking=false;synthActive=false;$('ampRow').style.display='none';startIdleLoop();});
}
function disconnectTTS(){
  socket?.disconnect();socket=null;ttsConnected=false;speaking=false;synthActive=false;
  setTTSUI('Disconnected','off');
  $('connectBtn').disabled=false;$('disconnectBtn').disabled=$('speakBtn').disabled=true;
  $('ampRow').style.display='none';
  startIdleLoop();
}
function setTTSUI(msg,cls){$('ttsLabel').textContent=msg;$('ttsDot').className='dot '+cls;}
function speak(){
  const text=$('replyText').value.trim();if(!text||!socket?.connected)return;
  synthActive=true;ensureAudio();socket.emit('synthesize',{text,voice:$('voiceSelect').value,speed:parseFloat($('spdInput').value)});
  $('overlayText').textContent=text;
}
function stopSpeaking(){
  socket?.emit('cancel');speaking=false;synthActive=false;_pendingLoop=_pendingShot=null;
  if(audioCtx){audioCtx.suspend().then(()=>audioCtx.resume());nextStart=0;}
  $('ampRow').style.display='none';mouthDrive=0;setChatState('');
  setTimeout(startIdleLoop,300);
}

// ── Animation system ────────────────────────────────────────────────────────
async function preloadAnimations(){
  if(!vrm)return;
  const btns=[...$('animGrid').querySelectorAll('.anim-btn')];
  if(!btns.length)return;
  $('animStatus').textContent=`Preloading 0/${btns.length}...`;
  let done=0;
  await Promise.allSettled(btns.map(async btn=>{
    try{
      const clip=await loadMixamoAnimation(btn.dataset.url,vrm);
      clipCache.set(btn.dataset.name,clip);clipCache.set(btn.dataset.url,clip);
      $('animStatus').textContent=`Preloading ${++done}/${btns.length}...`;
    }catch(e){console.warn('Preload fail:',btn.dataset.name,e.message);}
  }));
  $('animStatus').textContent=`${done} animations ready`;
  setTimeout(()=>{if($('animStatus').textContent.includes('ready'))$('animStatus').textContent='';},2500);
  setTimeout(startIdleLoop,400);
}

function _activateAction(action,name){
  if(!mixer)return;
  autoIdle=false;idleCycleAt=Infinity;
  if(activeAction&&activeAction!==action){action.reset();action.crossFadeFrom(activeAction,0.30,true);}
  else action.reset();
  action.play();activeAction=action;fbxPlaying=true;activeEmote=null;
  highlightEmoteBtn(null);
  $('animStatus').textContent='> '+name;$('stopAnimBtn').disabled=false;
  $('nowPlayingName').textContent=name;$('nowPlaying').style.display='flex';
  $('animGrid').querySelectorAll('.anim-btn').forEach(b=>b.classList.toggle('active',b.dataset.name===name));
}

function _prepareAction(name,loop){
  if(!vrm||!mixer)return null;
  const clip=clipCache.get(name);if(!clip)return null;
  const action=mixer.clipAction(clip);
  action.setLoop(loop?THREE.LoopRepeat:THREE.LoopOnce,Infinity);
  if(!loop)action.clampWhenFinished=true;
  return action;
}

function playAnimation(url,name){
  if(!vrm){$('animStatus').textContent='Load a VRM first.';return;}
  const go=clip=>{
    if(!mixer)mixer=new THREE.AnimationMixer(vrm.scene);
    const action=mixer.clipAction(clip);
    action.setLoop(loopAnimation?THREE.LoopRepeat:THREE.LoopOnce,Infinity);
    if(!loopAnimation)action.clampWhenFinished=true;
    _activateAction(action,name);
    mixer.removeEventListener('finished',_onAnimDone);
    if(!loopAnimation)mixer.addEventListener('finished',_onAnimDone);
  };
  if(clipCache.has(name)){go(clipCache.get(name));}
  else{
    $('animStatus').textContent='Loading '+name+'...';
    loadMixamoAnimation(url,vrm).then(clip=>{clipCache.set(name,clip);clipCache.set(url,clip);go(clip);})
    .catch(e=>{$('animStatus').textContent='Error: '+e.message;});
  }
}

function _onAnimDone(){
  fbxPlaying=false;autoIdle=false;activeEmote='idle';highlightEmoteBtn('idle');
  $('animStatus').textContent='';$('stopAnimBtn').disabled=true;
  $('nowPlaying').style.display='none';
  $('animGrid').querySelectorAll('.anim-btn').forEach(b=>b.classList.remove('active'));
  setTimeout(startIdleLoop,200);
}

function stopAnimation(){
  _pendingLoop=_pendingShot=null;autoIdle=false;idleCycleAt=Infinity;
  activeAction?.fadeOut(0.3);setTimeout(()=>{activeAction?.stop();activeAction=null;},350);
  fbxPlaying=false;activeEmote='idle';highlightEmoteBtn('idle');
  $('animStatus').textContent='';$('stopAnimBtn').disabled=true;
  $('nowPlaying').style.display='none';
  $('animGrid').querySelectorAll('.anim-btn').forEach(b=>b.classList.remove('active'));
  setTimeout(startIdleLoop,400);
}

function toggleLoop(){
  loopAnimation=!loopAnimation;
  $('loopBtn').textContent='Loop: '+(loopAnimation?'On':'Off');
  if(activeAction)activeAction.setLoop(loopAnimation?THREE.LoopRepeat:THREE.LoopOnce,Infinity);
}

// ── handlePreset: core sync coordinator ────────────────────────────────────
// Flow:
//   1. Response received from /api/chat
//   2. emit('synthesize') → synthActive=true
//   3. synthesis_start  → speaking=true  (no animation yet)
//   4. audio_chunk[0]   → schedule PCM + activate BOTH pending animations NOW
//   5. All PCM done     → speaking=false, synthActive=false → startIdleLoop()
function handlePreset(preset){
  if(preset.expression)setExpr(preset.expression,1.0);
  if(!preset.animation&&preset.emote)setEmote(preset.emote);
  _pendingLoop=_pendingShot=null;
  if(preset.animation&&vrm){
    if(!mixer)mixer=new THREE.AnimationMixer(vrm.scene);
    const action=_prepareAction(preset.animation,preset.animation_loop);
    if(action){
      if(preset.animation_loop){_pendingLoop={action,name:preset.animation};if(preset.emote)setEmote(preset.emote);}
      else _pendingShot={action,name:preset.animation};
    } else {
      // Not cached yet (fallback on-demand load)
      const btn=[...$('animGrid').querySelectorAll('.anim-btn')].find(b=>b.dataset.name===preset.animation);
      if(btn){
        loadMixamoAnimation(btn.dataset.url,vrm).then(clip=>{
          clipCache.set(btn.dataset.name,clip);clipCache.set(btn.dataset.url,clip);
          const a=_prepareAction(preset.animation,preset.animation_loop);
          if(a){if(preset.animation_loop)_pendingLoop={action:a,name:preset.animation};
                else _pendingShot={action:a,name:preset.animation};}
        });
      }
    }
  }
  if(preset.text&&socket?.connected){
    synthActive=true;ensureAudio();
    socket.emit('synthesize',{text:preset.text,voice:$('voiceSelect').value,speed:parseFloat($('spdInput').value)});
    $('overlayText').textContent=preset.text;
    // Animations are activated in audio_chunk[0] handler — not here.
  } else {
    // No TTS connected: activate animations immediately
    if(_pendingLoop){_activateAction(_pendingLoop.action,_pendingLoop.name);_pendingLoop=null;}
    if(_pendingShot){_activateAction(_pendingShot.action,_pendingShot.name);_pendingShot=null;}
  }
}

// ── Chat ────────────────────────────────────────────────────────────────────
async function sendChat(){
  const msg=$('chatInput').value.trim();if(!msg)return;
  $('chatInput').value='';$('sendBtn').disabled=true;
  addMsg('user',msg);setChatState('thinking');
  // Play thinking animation while waiting for API
  if(vrm&&clipCache.has('Focus')){
    if(!mixer)mixer=new THREE.AnimationMixer(vrm.scene);
    const a=mixer.clipAction(clipCache.get('Focus'));
    a.setLoop(THREE.LoopRepeat,Infinity);
    if(activeAction&&activeAction!==a)a.reset().crossFadeFrom(activeAction,0.3,true);else a.reset();
    a.play();activeAction=a;fbxPlaying=true;autoIdle=false;idleCycleAt=Infinity;activeEmote=null;highlightEmoteBtn(null);
  }else setEmote('think');
  try{
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg,history:chatHistory.slice(-12)})});
    if(!res.ok)throw new Error('API '+res.status);
    const preset=await res.json();
    if(preset.error)throw new Error(preset.error);
    addMsg('bot',preset.text);
    handlePreset(preset);
  }catch(e){
    console.error(e);addMsg('sys','Error: '+e.message);setChatState('');
    setEmote('idle');fbxPlaying=false;synthActive=false;startIdleLoop();
  }finally{$('sendBtn').disabled=false;}
}

// ── Speech Recognition ──────────────────────────────────────────────────────
let recognition=null,micActive=false;
function initSTT(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){addMsg('sys','Speech recognition not supported.');return false;}
  recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.lang='en-US';
  recognition.onstart=()=>{micActive=true;$('micBtn').classList.add('mic-on');setChatState('listening');};
  recognition.onend=()=>{micActive=false;$('micBtn').classList.remove('mic-on');if(!$('chatInput').value.trim())setChatState('');};
  recognition.onerror=e=>{micActive=false;$('micBtn').classList.remove('mic-on');addMsg('sys','Mic error: '+e.error);};
  recognition.onresult=e=>{
    const last=e.results[e.results.length-1];
    $('chatInput').value=last[0].transcript;
    if(last.isFinal){recognition.stop();setTimeout(sendChat,80);}
  };
  return true;
}

// ── VRM helpers ─────────────────────────────────────────────────────────────
const getBone=name=>vrm?.humanoid?.getNormalizedBoneNode(name)??null;
function setExpr(name,val){
  const m=vrm?.expressionManager;if(!m)return;
  try{m.setValue(name,val);}catch(_){try{m.setExpression(name,val);}catch(_){}}
}
function getExpr(name){const m=vrm?.expressionManager;if(!m)return 0;try{return m.getValue(name)??0;}catch(_){return 0;}}
function resetFace(){
  ['aa','ih','ou','ee','oh','blinkLeft','blinkRight','happy','angry','sad','relaxed','surprised'].forEach(n=>setExpr(n,0));

// ── Lip sync ─────────────────────────────────────────────────────────────────
// AnalyserNode RMS → mouthDrive every frame. Zero lag because we read the
// actual audio waveform that is currently playing through the speakers.
function updateLipSync(){
  let target=0;
  if(speaking&&ttsConnected){
    const rms=audioRMS();target=THREE.MathUtils.clamp(rms*5.5,0,1);
    const p=Math.min(99,Math.round(rms*500));
    $('ampFill').style.width=p+'%';$('ampLbl').textContent=p+'%';
  }else if(speaking){
    target=THREE.MathUtils.clamp(.1+.45*(.5+.5*Math.sin((clock.elapsedTime+mouthSeed)*13)),0,1);
  }else{$('ampFill').style.width='0%';$('ampLbl').textContent='0%';}
  mouthDrive=THREE.MathUtils.lerp(mouthDrive,target,.35);
  setExpr('aa',mouthDrive*.9);setExpr('ih',mouthDrive*.22);
  setExpr('ou',mouthDrive*.15);setExpr('ee',mouthDrive*.07);
}
function updateBlink(dt){
  if(!autoBlink)return;blinkH+=dt;const b=Math.sin(blinkH*1.8)>.995?1:0;
  blinkV=THREE.MathUtils.lerp(blinkV,b,.22);setExpr('blinkLeft',blinkV);setExpr('blinkRight',blinkV);
}

// ── Procedural poses (normalised bones) ────────────────────────────────────
// In normalised T-pose: left arm → +X, right arm → -X.
// Arms-down: lUpperArm.z = -1.22, rUpperArm.z = +1.22
function naturalArms(){
  const lU=getBone('leftUpperArm'),rU=getBone('rightUpperArm');
  const lL=getBone('leftLowerArm'),rL=getBone('rightLowerArm');
  const lH=getBone('leftHand'),rH=getBone('rightHand');
  if(lU){lU.rotation.x=.06;lU.rotation.y=0;lU.rotation.z=-1.22;}
  if(rU){rU.rotation.x=.06;rU.rotation.y=0;rU.rotation.z= 1.22;}
  if(lL){lL.rotation.x=.08;lL.rotation.y=0;lL.rotation.z=0;}
  if(rL){rL.rotation.x=.08;rL.rotation.y=0;rL.rotation.z=0;}
  if(lH)lH.rotation.set(0,0,0);if(rH)rH.rotation.set(0,0,0);
}
function baseIdle(t){
  const sp=getBone('spine'),ch=getBone('chest'),uc=getBone('upperChest'),nk=getBone('neck'),hd=getBone('head');
  const sw=Math.sin(t*.9)*.032,bob=Math.sin(t*1.1)*.013,br=Math.sin(t*1.25)*.016;
  if(sp){sp.rotation.z=sw*.22;sp.position.y=br*.4;}if(ch)ch.rotation.z=sw*.30;
  if(uc)uc.rotation.y=sw*.45;if(nk)nk.rotation.y=Math.sin(t*.7)*.04;
  if(hd){hd.rotation.y=Math.sin(t*.6)*.04;hd.rotation.x=bob;}
}
function emoteWave(t){
  naturalArms();const u=getBone('rightUpperArm'),l=getBone('rightLowerArm'),h=getBone('rightHand');
  const s=Math.sin(t*10)*.7;
  if(u){u.rotation.z=.18;u.rotation.x=-.18;u.rotation.y=.45;}
  if(l){l.rotation.z=-.35+s*.22;l.rotation.x=-.12;}if(h)h.rotation.z=.18+s*.4;
}
function emoteNod(t){
  naturalArms();const h=getBone('head'),n=getBone('neck'),nd=Math.sin(t*5.5)*.16+.06;
  if(h){h.rotation.x=nd;h.rotation.y=Math.sin(t*.6)*.03;}if(n)n.rotation.x=nd*.45;
}
function emoteDance(t){
  const b=Math.sin(t*3.2),b2=Math.cos(t*3.2),b4=Math.sin(t*6.4);
  const hp=getBone('hips'),sp=getBone('spine'),ch=getBone('chest');
  const lU=getBone('leftUpperArm'),rU=getBone('rightUpperArm');
  const lL=getBone('leftLowerArm'),rL=getBone('rightLowerArm'),nk=getBone('neck'),hd=getBone('head');
  if(hp){hp.rotation.y=b*.22;hp.rotation.z=b*.09;}
  if(sp){sp.rotation.z=-b*.14;sp.rotation.y=b2*.08;sp.position.y=Math.abs(b4)*.05;}
  if(ch)ch.rotation.z=b*.10;if(nk)nk.rotation.y=b2*.07;
  if(hd){hd.rotation.y=b*.06;hd.rotation.z=b2*.04;}
  if(lU){lU.rotation.z=-(0.85+b2*.38);lU.rotation.x=b*.18;}
  if(rU){rU.rotation.z=(0.85+b*.38);rU.rotation.x=b2*.18;}
  if(lL)lL.rotation.x=.28+b*.22;if(rL)rL.rotation.x=.28+b2*.22;
}
function emoteThink(t){
  const slow=Math.sin(t*.6)*.04;
  const lU=getBone('leftUpperArm'),lL=getBone('leftLowerArm'),lH=getBone('leftHand');
  const rU=getBone('rightUpperArm'),rL=getBone('rightLowerArm'),hd=getBone('head'),nk=getBone('neck');
  if(lU){lU.rotation.z=-.55;lU.rotation.x=.35;lU.rotation.y=-.25;}if(lL)lL.rotation.x=1.15;if(lH)lH.rotation.x=.25;
  if(rU){rU.rotation.z=.55;rU.rotation.x=.45;rU.rotation.y=.35;}if(rL)rL.rotation.x=1.35;
  if(hd){hd.rotation.z=.1+slow;hd.rotation.y=slow*1.2;}if(nk)nk.rotation.x=.04;
}
function emoteBounce(t){
  const b=Math.abs(Math.sin(t*4.2)),b2=Math.sin(t*4.2);
  const sp=getBone('spine'),hp=getBone('hips'),lU=getBone('leftUpperArm'),rU=getBone('rightUpperArm'),hd=getBone('head');
  if(hp)hp.position.y=b*.06;if(sp){sp.rotation.z=b2*.04;sp.position.y=b*.04;}if(hd)hd.rotation.x=-b*.04;
  if(lU){lU.rotation.z=-1.15+b2*.18;lU.rotation.x=-b*.08;}if(rU){rU.rotation.z=1.15-b2*.18;rU.rotation.x=-b*.08;}
}
function emoteShrug(t){
  const e=.5+.5*Math.sin(t*1.8);
  const lU=getBone('leftUpperArm'),rU=getBone('rightUpperArm'),lL=getBone('leftLowerArm'),rL=getBone('rightLowerArm');
  const lS=getBone('leftShoulder'),rS=getBone('rightShoulder'),nk=getBone('neck'),hd=getBone('head');
  if(lS)lS.rotation.z=-e*.3;if(rS)rS.rotation.z=e*.3;
  if(lU){lU.rotation.z=-(0.7+e*.3);lU.rotation.x=.4;}if(rU){rU.rotation.z=(0.7+e*.3);rU.rotation.x=.4;}
  if(lL)lL.rotation.x=.9;if(rL)rL.rotation.x=.9;
  if(nk)nk.rotation.x=e*.06;if(hd)hd.rotation.z=Math.sin(t*.7)*.06;
}
function emotePoint(t){
  naturalArms();const p=Math.sin(t*2.5)*.04;
  const rU=getBone('rightUpperArm'),rL=getBone('rightLowerArm'),rH=getBone('rightHand'),hd=getBone('head');
  if(rU){rU.rotation.z=.35;rU.rotation.x=.5-p;rU.rotation.y=.2;}if(rL)rL.rotation.x=.15;
  if(rH){rH.rotation.x=-.15+p;rH.rotation.y=.1;}if(hd){hd.rotation.y=.1-p;hd.rotation.x=-.05;}
}
const emoteMap={idle:naturalArms,wave:emoteWave,nod:emoteNod,dance:emoteDance,
  think:emoteThink,bounce:emoteBounce,shrug:emoteShrug,point:emotePoint};
function applyEmote(t){(emoteMap[activeEmote]??naturalArms)(t);}

// ── Auto-idle system ─────────────────────────────────────────────────────────
// Patterns used to recognise idle/standing FBX animations in the cache.
const IDLE_PATTERNS=[/idle/i,/standing.*idle/i,/stand.*neutral/i,/breathing/i,/waiting/i];

function getIdleAnimNames(){
  // Return animation names (not URL keys) that look like idle animations.
  return [...clipCache.keys()]
    .filter(k=>typeof k==='string'&&!k.startsWith('http')&&!k.startsWith('/')&&!k.includes('\\'))
    .filter(n=>IDLE_PATTERNS.some(p=>p.test(n)));
}

// startIdleLoop: soft-start a looping idle FBX. Safe to call repeatedly.
// Falls back to the procedural naturalArms+baseIdle path if no FBX idle exists.
function startIdleLoop(){
  if(!vrm)return;
  if(speaking||synthActive)return;          // TTS active — don't interrupt
  if(fbxPlaying&&!autoIdle)return;          // real user-triggered animation running
  idleCycleAt=Infinity;                     // reset cycle timer before we pick a new one

  const names=getIdleAnimNames();
  if(!names.length){
    // No FBX idle available — switch back to procedural path
    if(autoIdle){autoIdle=false;fbxPlaying=false;}
    return;
  }
  if(!mixer)mixer=new THREE.AnimationMixer(vrm.scene);
  // Pick randomly for variety across cycles
  const name=names[Math.floor(Math.random()*names.length)];
  const clip=clipCache.get(name);if(!clip)return;
  const action=mixer.clipAction(clip);
  action.setLoop(THREE.LoopRepeat,Infinity);action.timeScale=1;
  if(activeAction&&activeAction!==action){action.reset();action.crossFadeFrom(activeAction,0.7,true);}
  else action.reset();
  action.play();
  activeAction=action;fbxPlaying=true;autoIdle=true;activeEmote=null;
  highlightEmoteBtn(null);
  // No "nowPlaying" UI update for background idle — keeps UI clean
  idleCycleAt=clock.elapsedTime+(18+Math.random()*12); // cycle to another idle in 18-30s
}
function setEmote(id){
  activeEmote=id;autoIdle=false;idleCycleAt=Infinity;
  if(id!==null&&fbxPlaying){
    activeAction?.fadeOut(.3);setTimeout(()=>{activeAction?.stop();},350);
    fbxPlaying=false;$('animGrid').querySelectorAll('.anim-btn').forEach(b=>b.classList.remove('active'));
    $('nowPlaying').style.display='none';$('animStatus').textContent='';
  }
  highlightEmoteBtn(id);
  $('emoteHint').textContent=EMOTES.find(e=>e.id===id)?.hint??'';
}
function highlightEmoteBtn(id){
  $('emoteGrid').querySelectorAll('.emote-btn').forEach(b=>b.classList.toggle('active',b.dataset.emote===id));
}

// ── VRM loading ─────────────────────────────────────────────────────────────
const gltfLoader=new GLTFLoader();gltfLoader.register(p=>new VRMLoaderPlugin(p));
function onVRMLoaded(v,name){
  if(vrm?.scene){scene.remove(vrm.scene);disposeVRM(vrm.scene);}

function disposeVRM(root){root.traverse(o=>{o.geometry?.dispose?.();[o.material].flat().forEach(m=>{if(!m)return;Object.values(m).forEach(v=>v?.isTexture&&v.dispose?.());m.dispose?.();});});}

    const list=await r.json();if(!list.length)return;
    $('serverModels').style.display='block';$('serverModelBtns').innerHTML='';
    for(const m of list){
      const btn=document.createElement('button');btn.className='sec';btn.style.fontSize='11px';
      btn.textContent=m.name.replace(/\.vrm$/i,'').slice(0,18);
      btn.onclick=()=>loadVRMURL(m.url,m.name);$('serverModelBtns').appendChild(btn);
    }
  }catch(_){}
}

// ── Render loop ──────────────────────────────────────────────────────────────
function update(){
  requestAnimationFrame(update);
  const dt=clock.getDelta(),t=clock.elapsedTime;
  controls.update();
  if(vrm){
    // Always update mixer so crossfades and active clips advance
    if(mixer)mixer.update(dt);
    if(fbxPlaying){
      // FBX / auto-idle is driving bones.
      // Cycle idle animation periodically for variety.
      if(autoIdle&&t>idleCycleAt)startIdleLoop();
    }else{
      // No FBX → run procedural breathing idle + active emote
      baseIdle(t);applyEmote(t);
    }
    updateLipSync();updateBlink(dt);
    vrm.update(dt); // spring bones last
  }
  renderer.render(scene,camera);
}

// ── Init ─────────────────────────────────────────────────────────────────────
function setCamHome(){
  camera.position.set(charPos.x, charPos.y+1.45, charPos.z+3);
  controls.target.set(charPos.x, charPos.y+1.35, charPos.z);
  controls.update();
}
function resize(){
  const w=$('canvasWrap').clientWidth,h=$('canvasWrap').clientHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);
}
window.addEventListener('resize',resize);resize();

for(const e of EMOTES){
  const b=document.createElement('button');
  b.className='emote-btn'+(e.id==='idle'?' active':'');
  b.dataset.emote=e.id;b.textContent=e.label;b.onclick=()=>setEmote(e.id);
  $('emoteGrid').appendChild(b);
}
$('emoteHint').textContent=EMOTES[0].hint;

fetchServerAssets();setCamHome();update();
$('vrmFile').addEventListener('change',e=>{const f=e.target.files?.[0];if(f)loadVRMBlob(f);});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{
  e.preventDefault();const f=e.dataTransfer?.files?.[0];
  if(f?.name.toLowerCase().endsWith('.vrm'))loadVRMBlob(f);
});
[$('mouthOpen'),$('smile'),$('blink'),$('surprise')].forEach(s=>s.addEventListener('input',()=>{
  setExpr('aa',+$('mouthOpen').value);setExpr('happy',+$('smile').value);
  setExpr('blinkLeft',+$('blink').value);setExpr('blinkRight',+$('blink').value);
  setExpr('surprised',+$('surprise').value);
}));
$('resetFaceBtn').addEventListener('click',resetFace);
$('blinkBtn').addEventListener('click',()=>{
  autoBlink=!autoBlink;$('blinkBtn').textContent='Blink: '+(autoBlink?'Auto':'Off');
});
$('camBtn').addEventListener('click',setCamHome);

// Expose to window for inline onclick handlers (module scope is not global)
window.connectTTS=connectTTS;window.disconnectTTS=disconnectTTS;
window.speak=speak;window.stopSpeaking=stopSpeaking;
window.stopAnimation=stopAnimation;window.toggleLoop=toggleLoop;
window.sendChat=sendChat;window.toggleMic=toggleMic;
window.updateCharPos=updateCharPos;window.resetCharPos=resetCharPos;

// ── UI extras: panel toggle + Lucide icons ────────────────────────────────
// These are the ONLY additions to the JS — purely presentation, no logic change.
function togglePanel(id){
  const panels=['statusPanel','interactPanel','debugPanel'];
  const btns={statusPanel:'statusBtn',interactPanel:'interactBtn',debugPanel:'debugBtn'};
  const wasOpen=$(id).classList.contains('open');
  panels.forEach(p=>{$(p).classList.remove('open');$(btns[p])?.classList.remove('active');});
  if(!wasOpen){$(id).classList.add('open');$(btns[id])?.classList.add('active');}
}
window.togglePanel=togglePanel;

// Mirror #ttsDot class changes to the HUD status-button dot
const _hubDot=$('statusBtnDot');
if(_hubDot){
  new MutationObserver(()=>{
    _hubDot.className='sdot'+($('ttsDot').classList.contains('on')?' on':' off');
  }).observe($('ttsDot'),{attributes:true,attributeFilter:['class']});
}

// Render Lucide icons after DOM is ready
setTimeout(()=>window.lucide?.createIcons(),20);
</script>
