# MindMate — Podman/Docker Compose orchestration
# Frontend (VRM + chat API) :8080  +  Kokoro TTS (WebSocket) :5000
#
# Usage via ./mindmate.sh (preferred), or directly:
#   podman-compose up -d --build
#   podman compose  up -d --build   (if using the podman compose plugin)
#
# The browser connects to TTS at http://localhost:5000 (editable in the UI),
# and to the chat API same-origin at /api/chat, so no CORS/proxy tweaks needed.
name: mindmate

services:
  tts:
    build:
      context: ./audio-model
    image: mindmate-tts:local
    container_name: mindmate-tts
    ports:
      - "${TTS_PORT:-5000}:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    image: mindmate-frontend:local
    container_name: mindmate-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      ASSETS_DIR: "/assets"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      NEXT_PUBLIC_TTS_URL: "http://localhost:${TTS_PORT:-5000}"
    volumes:
      # Large 3D assets stay on the host and are mounted read-only.
      # Served by Next route handlers from ASSETS_DIR (lib/assets.ts).
      - ./main/models:/assets/models:ro
      - ./main/animations:/assets/animations:ro
      - ./main/background:/assets/background:ro
    depends_on:
      tts:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/models"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
